<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Learn Japanese with Velmorth — JLPT N5 to N1, Hiragana, Lessons, and more." />
  <title>Velmorth — Learn Japanese</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a1a0f" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="root">
    <!-- Splash screen -->
    <div id="splash-screen">
      <div class="splash-logo">
        <div class="splash-icon">🌿</div>
        <h1 class="splash-title">Velmorth</h1>
        <p class="splash-sub">Learn Japanese</p>
        <div class="splash-loader">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>

    <!-- Main App Shell (hidden until loaded) -->
    <div id="app-shell" class="hidden">
      <!-- Top Bar -->
      <header id="topbar"></header>

      <!-- Page Content -->
      <main id="page-content"></main>

      <!-- Bottom Nav -->
      <nav id="bottom-nav"></nav>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container"></div>
  <!-- Modal container -->
  <div id="modal-container"></div>
  <!-- Confetti container -->
  <div id="confetti-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
